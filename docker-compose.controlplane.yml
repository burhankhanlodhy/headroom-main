# ContextShrink control plane: Postgres + API.
# Run on the Pi:  cp controlplane.env.example .env  -> edit secrets ->
#                 docker compose -f docker-compose.controlplane.yml up -d
# Postgres always binds loopback. The API binds loopback by default; on the
# deployment Pi set API_BIND=0.0.0.0 in .env so the web tier's reverse proxy
# (Pi 4) can reach it over the LAN.

services:
  postgres:
    image: postgres:16-alpine
    container_name: contextshrink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contextshrink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-contextshrink}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contextshrink} -d ${POSTGRES_DB:-contextshrink}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: contextshrink-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-contextshrink}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-contextshrink}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      FREE_SAVINGS_CAP_USD: ${FREE_SAVINGS_CAP_USD:-20}
      CONTEXTSHRINK_SERVICE_TOKEN: ${CONTEXTSHRINK_SERVICE_TOKEN:?set CONTEXTSHRINK_SERVICE_TOKEN}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    ports:
      - "${API_BIND:-127.0.0.1}:8788:8788"

volumes:
  pgdata:

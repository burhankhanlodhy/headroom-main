# =============================================================================
# Horizon proxy compose (trimmed: proxy only, optional TLS front)
# =============================================================================
# Quick start:
#   1. cp .env.example .env   # then set HORIZON_PROXY_TOKEN (openssl rand -hex 32)
#   2. docker compose up -d
#   3. point your LLM client at http://localhost:8787  (proxy)
#
# The published port is loopback-only. For network access put a TLS reverse
# proxy in front AND require HORIZON_PROXY_TOKEN - never one without the other.
#
# TLS front (VPS with a DNS name):
#   1. set HORIZON_PUBLIC_DOMAIN in .env (e.g. horizon.example.com)
#   2. docker compose --profile tls up -d
#   3. Caddy terminates TLS on 80/443 and obtains certificates automatically
#
# Per-user keys live in the horizon_workspace volume (keys.db), so issuing a
# key from the host is: docker compose exec horizon-proxy horizon keys issue <name>
# See DEPLOY.md for the full walkthrough.
# =============================================================================

services:
  horizon-proxy:
    build:
      context: .
      args:
        HORIZON_BUILD_VERSION: ${HORIZON_BUILD_VERSION:-source-build}
    # Host networking (Linux): the proxy binds host loopback directly, so
    # SSH-tunneled clients present as 127.0.0.1 and pass the loopback trust
    # boundary (auth gate, dashboard fields) without a token. In a bridge
    # network the DNAT'd peer is the gateway IP, which the gate treats as
    # untrusted and 401s every tunnelled request. The loopback bind itself
    # is the confinement - nothing off-box can reach the port.
    network_mode: host
    command: ["--host", "127.0.0.1"]
    environment:
      - HORIZON_HOST=127.0.0.1
      - HORIZON_PROXY_TOKEN=${HORIZON_PROXY_TOKEN:?set HORIZON_PROXY_TOKEN (see .env.example; e.g. openssl rand -hex 32)}
      - HOME=/home/nonroot
      - HORIZON_WORKSPACE_DIR=/home/nonroot/.horizon
      - HORIZON_CONFIG_DIR=/home/nonroot/.horizon/config
    volumes:
      - horizon_workspace:/home/nonroot/.horizon
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional TLS front. Activated with: docker compose --profile tls up -d
  # NOTE: with horizon-proxy in host-network mode, caddy must also use
  # network_mode: host and target 127.0.0.1:8787 (adjust the Caddyfile
  # upstream) when you enable this profile.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      - HORIZON_PUBLIC_DOMAIN=${HORIZON_PUBLIC_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - horizon-proxy

volumes:
  horizon_workspace:
  caddy_data:
  caddy_config:

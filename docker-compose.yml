# =============================================================================
# Headroom proxy compose (trimmed: proxy only)
# =============================================================================
# Quick start:
#   1. cp .env.example .env   # then set HEADROOM_PROXY_TOKEN (openssl rand -hex 32)
#   2. docker compose up -d
#   3. point your LLM client at http://localhost:8787  (proxy)
#
# The published port is loopback-only. For network access put a TLS reverse
# proxy in front AND require HEADROOM_PROXY_TOKEN - never one without the other.
# =============================================================================

services:
  headroom-proxy:
    build:
      context: .
      args:
        HEADROOM_BUILD_VERSION: ${HEADROOM_BUILD_VERSION:-source-build}
    # Bind to all interfaces inside the container so the published port is
    # reachable; the published port below confines it to host loopback.
    command: ["--host", "0.0.0.0"]
    environment:
      - HEADROOM_HOST=0.0.0.0
      - HEADROOM_PROXY_TOKEN=${HEADROOM_PROXY_TOKEN:?set HEADROOM_PROXY_TOKEN (see .env.example; e.g. openssl rand -hex 32)}
      - HOME=/home/nonroot
      - HEADROOM_WORKSPACE_DIR=/home/nonroot/.headroom
      - HEADROOM_CONFIG_DIR=/home/nonroot/.headroom/config
    ports:
      # Loopback-only. The container listens on 0.0.0.0 (above) so port
      # forwarding works; this line controls which host interfaces publish it.
      - "127.0.0.1:8787:8787"
    volumes:
      - headroom_workspace:/home/nonroot/.headroom
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  headroom_workspace:

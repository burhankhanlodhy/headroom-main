# =============================================================================
# Horizon proxy compose (trimmed: proxy only)
# =============================================================================
# Quick start:
#   1. cp .env.example .env   # then set HORIZON_PROXY_TOKEN (openssl rand -hex 32)
#   2. docker compose up -d
#   3. point your LLM client at http://localhost:8787  (proxy)
#
# The published port is loopback-only. For network access put a TLS reverse
# proxy in front AND require HORIZON_PROXY_TOKEN - never one without the other.
# =============================================================================

services:
  horizon-proxy:
    build:
      context: .
      args:
        HORIZON_BUILD_VERSION: ${HORIZON_BUILD_VERSION:-source-build}
    # Bind to all interfaces inside the container so the published port is
    # reachable; the published port below confines it to host loopback.
    command: ["--host", "0.0.0.0"]
    environment:
      - HORIZON_HOST=0.0.0.0
      - HORIZON_PROXY_TOKEN=${HORIZON_PROXY_TOKEN:?set HORIZON_PROXY_TOKEN (see .env.example; e.g. openssl rand -hex 32)}
      - HOME=/home/nonroot
      - HORIZON_WORKSPACE_DIR=/home/nonroot/.horizon
      - HORIZON_CONFIG_DIR=/home/nonroot/.horizon/config
    ports:
      # Loopback-only. The container listens on 0.0.0.0 (above) so port
      # forwarding works; this line controls which host interfaces publish it.
      - "127.0.0.1:8787:8787"
    volumes:
      - horizon_workspace:/home/nonroot/.horizon
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  horizon_workspace:
